apiVersion: v1
kind: Service
metadata:
  name: plastic-detection-api
  namespace: plastic-detection
  labels:
    app.kubernetes.io/name: plastic-detection
    app.kubernetes.io/component: api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: plastic-detection
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000          # cluster-internal port
      targetPort: http    # container's named port (8000)
      nodePort: 30080     # external port on every node in the cluster
      protocol: TCP

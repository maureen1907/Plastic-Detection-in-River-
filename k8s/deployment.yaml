apiVersion: apps/v1
kind: Deployment
metadata:
  name: plastic-detection-api
  namespace: plastic-detection
  labels:
    app.kubernetes.io/name: plastic-detection
    app.kubernetes.io/component: api
    app.kubernetes.io/version: v2
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: plastic-detection
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plastic-detection
        app.kubernetes.io/component: api
        app.kubernetes.io/version: v2
    spec:
      containers:
        - name: api
          image: mpha0039/plastic-detection:v4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          # Resource limits per the assignment rubric:
          #   CPU limit: 1.0 vCPU (hard requirement)
          #   Memory: 4 GiB. Headroom for two uvicorn worker processes, each
          #   loading its own YOLO model copy (the architectural trick that
          #   gives us true parallelism around the Python GIL).
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"     # exactly 1 vCPU
              memory: "4Gi"

          # Liveness: K8s restarts the pod if /healthz fails.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60   # allow model load before first probe
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness: K8s only sends Service traffic to pods where /ready returns 200.
          # /ready only returns 200 once the YOLO model is loaded into memory,
          # preventing dropped requests during pod startup or replica scaling.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60     
            successThreshold: 1
